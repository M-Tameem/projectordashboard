name: Validate dashboard
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build x86 app and check input and WPF layouts
        shell: powershell
        run: ./tests/run-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpf-layout-previews
          path: .visual-check/*.png
          include-hidden-files: true
